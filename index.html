<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Maqueta de contenido del sitio de Conqr: Home, verticales, portafolio y blog.">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Maqueta sitio Conqr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,800;1,400;1,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero limpio + bloques de servicio a pantalla partida (texto / imagen), el texto pesado hasta el pie */
:root{
  --bg:#000000;
  --panel:#0B0D10;
  --panel-2:#111418;
  --line:#1E2228;
  --fg:#FFFFFF;
  --fg-soft:#8B939E;
  --fg-dim:#4A515B;
  --accent:#29A8E8;
  --note:#E8D28A;
  --note-bg:#241F0E;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.03em;line-height:1.03;text-wrap:balance}
p{margin:0}
em{font-style:italic;font-weight:400;color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* barra de maqueta */
.bar{background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:9px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft)}
.count{font-family:var(--mono);font-size:11px;color:var(--fg-soft);font-variant-numeric:tabular-nums}
.count b{color:var(--fg);font-weight:500}
.ctl{font-family:var(--mono);font-size:10.5px;background:none;color:var(--fg-soft);border:1px solid var(--line);border-radius:3px;padding:6px 10px;cursor:pointer}
.ctl:hover,.ctl[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

/* notas */
.note{display:none}
body.notes .note{display:block;margin:0 0 26px}
.note-in{background:var(--note-bg);color:var(--note);border-left:2px solid currentColor;font-family:var(--mono);font-size:11px;line-height:1.7;padding:11px 14px;text-transform:none}
.note-in b{font-weight:500}

/* ---------- nav ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:rgba(0,0,0,.86);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;padding-block:16px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.06em;cursor:pointer}
.logo i{color:var(--accent);font-style:normal}
.nav-sp{flex:1}
.menu{display:flex;align-items:center;gap:2px}
.mi{position:relative}
.mi > button{font-family:var(--font);font-size:13px;font-weight:500;color:var(--fg-soft);background:none;border:0;padding:9px 13px;cursor:pointer;border-radius:999px;white-space:nowrap}
.mi > button:hover,.mi.on > button{color:var(--fg)}
.mi > button .car{display:inline-block;margin-left:6px;font-size:9px;color:var(--fg-dim);vertical-align:1px}
.dd{position:absolute;top:100%;left:0;min-width:238px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.mi:hover .dd,.mi:focus-within .dd{opacity:1;visibility:visible;transform:translateY(4px)}
.dd button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font-family:var(--font);font-size:13.5px;padding:10px 12px;border-radius:4px;cursor:pointer}
.dd button:hover{background:rgba(41,168,232,.12);color:var(--accent)}
.dd button span{display:block;font-size:11px;color:var(--fg-dim);margin-top:2px}
.pill{border:1px solid var(--fg);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--fg);font-family:var(--font);white-space:nowrap}
.pill:hover{background:var(--fg);color:#000}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:4px;color:var(--fg);padding:8px 11px;cursor:pointer;font-family:var(--mono);font-size:11px}

/* ---------- hero ---------- */
.hero{border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.86fr);gap:48px;align-items:center;padding-block:clamp(64px,9vw,118px)}
.kicker{color:var(--accent);margin-bottom:28px}
h1{font-size:clamp(2.6rem,6.6vw,4.9rem)}
.lede{color:var(--fg-soft);font-size:clamp(1.08rem,1.9vw,1.38rem);line-height:1.45;max-width:40ch;margin:0 0 30px}
.acts{margin-top:38px;display:flex;flex-wrap:wrap;gap:12px}
.btn{border-radius:999px;padding:14px 26px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);border:1px solid var(--fg);background:var(--fg);color:#000}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-b{background:transparent;color:var(--fg)}
.btn-b:hover{background:transparent;border-color:var(--accent);color:var(--accent)}

/* etimologia de marca */
.etim{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:baseline}
.etim .w{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:800;letter-spacing:-.05em;line-height:1}
.etim .w i{font-style:normal;color:var(--accent)}
.etim .ph2{font-family:var(--mono);font-size:12px;color:var(--fg-dim);margin-top:14px;letter-spacing:.04em}
.etim .def{color:var(--fg-soft);font-size:clamp(1.05rem,2.2vw,1.35rem);line-height:1.4;max-width:34ch}
.etim .def b{color:var(--fg);font-weight:600}

/* portafolio */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:38px}
.filters button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:none;border:1px solid var(--line);border-radius:999px;color:var(--fg-soft);padding:9px 16px;cursor:pointer}
.filters button:hover{color:var(--fg)}
.filters button.on{background:var(--fg);color:#000;border-color:var(--fg)}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.work{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.work .ph{border:0;border-radius:0;border-bottom:1px solid var(--line);aspect-ratio:4/3}
.work .in{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.work .cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.work h3{font-size:1.05rem;font-weight:600;letter-spacing:-.015em}
.work p{font-size:.88rem;color:var(--fg-soft);line-height:1.5}
.work .res{margin-top:auto;padding-top:13px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.6}

/* bloque de imagen marcado */
.ph{position:relative;border:1px dashed #2C323A;border-radius:4px;background:
  linear-gradient(135deg,rgba(41,168,232,.08),rgba(255,255,255,.02)),
  repeating-linear-gradient(135deg,transparent 0 11px,rgba(255,255,255,.03) 11px 12px);
  display:grid;place-content:center;gap:6px;text-align:center;padding:22px;max-width:100%}
.ph .t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ph .d{font-size:12.5px;color:var(--fg-soft);max-width:34ch;line-height:1.5}
.ph-hero{aspect-ratio:1/1}

/* ---------- bloque de servicio a pantalla partida ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);align-items:stretch}
.split .side{padding:clamp(48px,6.5vw,96px) clamp(24px,5vw,84px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.split .media{min-height:clamp(280px,40vw,580px);border-left:1px solid var(--line)}
.split .media .ph{height:100%;border:0;border-radius:0}
.split.rev .side{order:2}
.split.rev .media{order:1;border-left:0;border-right:1px solid var(--line)}
.split h2{font-size:clamp(1.9rem,3.6vw,2.9rem)}
.split .txt{color:var(--fg-soft);margin-top:20px;max-width:44ch;font-size:clamp(.96rem,1.4vw,1.05rem)}
.split .items{margin:38px 0 0;padding:0 0 0 22px;list-style:none;border-left:1px solid var(--line)}
.split .items li{color:var(--fg-soft);font-size:14px;font-weight:500;padding:3px 0}
.split .go{margin-top:34px;align-self:flex-start;background:none;border:0;border-bottom:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.09em;padding:0 0 4px;cursor:pointer;text-transform:uppercase}
.split .go:hover{color:var(--fg);border-color:var(--fg)}

/* ---------- secciones ---------- */
section{border-bottom:1px solid var(--line)}
.sec{padding-block:clamp(56px,7vw,92px)}
.sec-head{max-width:58ch;margin-bottom:44px}
h2{font-size:clamp(1.9rem,4.1vw,2.9rem)}
.sub{color:var(--fg-soft);margin-top:16px;max-width:50ch}

/* dato */
.dato{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center}
.dato .big{font-size:clamp(3.4rem,11vw,6.6rem);font-weight:800;letter-spacing:-.06em;line-height:.88;color:var(--accent);font-variant-numeric:tabular-nums}
.dato .t2{font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:500;letter-spacing:-.02em;line-height:1.3;max-width:32ch}
.dato .src{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-top:12px;letter-spacing:.06em}

/* cifras */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:34px;text-align:center}
.stat b{display:block;font-size:clamp(2.6rem,7vw,4rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-soft);margin-top:14px}

/* plataformas */
.plats{display:flex;flex-wrap:wrap;gap:12px 34px;justify-content:center}
.plats span{font-size:clamp(1.05rem,2.6vw,1.6rem);font-weight:600;letter-spacing:-.02em;color:#3A414B}
.plats span:hover{color:var(--fg)}

/* proceso */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.step{background:var(--panel);padding:28px 24px 30px}
.step .n{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.1em;display:block;margin-bottom:14px}
.step h3{font-size:1.03rem;font-weight:600;letter-spacing:-.015em;margin-bottom:8px}
.step p{font-size:.9rem;color:var(--fg-soft);line-height:1.5}

/* blog */
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:24px}
.post{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.post .ph{border:0;border-radius:0;border-bottom:1px solid var(--line);aspect-ratio:16/9}
.post .in{padding:22px}
.post .kv{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.post h3{font-size:1.04rem;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.post .mt{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}

/* faq */
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{font-size:clamp(.98rem,2vw,1.12rem);font-weight:600;letter-spacing:-.015em;padding:23px 44px 23px 0;cursor:pointer;list-style:none;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:20px;font-family:var(--mono);font-size:19px;color:var(--accent);font-weight:400}
details[open] summary::after{content:"\2212"}
summary:hover{color:var(--accent)}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ans{padding:0 0 25px;color:var(--fg-soft);max-width:66ch}

/* contenido al pie */
.prose{color:var(--fg-soft);max-width:68ch}
.prose h3{font-size:1.16rem;font-weight:600;letter-spacing:-.02em;color:var(--fg);margin:30px 0 11px}
.prose h3:first-child{margin-top:0}
.prose p+p{margin-top:13px}
.prose ul{margin:12px 0 0;padding-left:19px}
.prose li{margin-bottom:7px}
.prose b{color:var(--fg);font-weight:600}
.expand{max-height:11.5em;overflow:hidden;position:relative;transition:max-height .5s ease}
.expand::after{content:"";position:absolute;inset:auto 0 0 0;height:5.5em;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg));transition:opacity .3s}
.expand.open{max-height:230em}
.expand.open::after{opacity:0}
.more{margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:none;border:1px solid var(--line);border-radius:999px;color:var(--accent);padding:10px 18px;cursor:pointer}
.more:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.expand{transition:none}}

.rel{display:flex;flex-wrap:wrap;gap:9px}
.rel button{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--fg-soft);padding:10px 16px;cursor:pointer}
.rel button:hover{color:var(--accent);border-color:var(--accent)}

.cta{text-align:center;padding-block:clamp(70px,10vw,112px)}
.cta h2{font-size:clamp(2rem,5.6vw,3.6rem);max-width:17ch;margin-inline:auto}
.cta p{color:var(--fg-soft);margin-top:20px;max-width:44ch;margin-inline:auto}
.cta .btn{margin-top:34px}

footer{background:var(--panel);border-top:1px solid var(--line)}
.foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:32px;padding-block:56px}
.foot h4{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-soft);margin:0 0 15px;font-weight:500}
.foot button{display:block;background:none;border:0;padding:4px 0;color:var(--fg);font-size:13px;cursor:pointer;font-family:var(--font);text-align:left}
.foot button:hover{color:var(--accent)}
.legal{border-top:1px solid var(--line);padding-block:22px;font-family:var(--mono);font-size:10px;color:var(--fg-dim);letter-spacing:.06em}

/* vista completa / impresion */
.pagewrap{border-bottom:6px solid var(--accent)}
.plabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);padding:26px 24px 0;max-width:1240px;margin:0 auto}
@media print{
  html,body{background:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,header,footer,.more,.filters,.note{display:none !important}
  .pagewrap{break-after:page;border-bottom:0}
  .split,.work,.post,.card,.step,details{break-inside:avoid}
  .hero-in{padding-block:40px}
  .sec{padding-block:36px}
  .expand{max-height:none !important;overflow:visible !important}
  .expand::after{display:none !important}
}

@media (max-width:980px){
  .menu{display:none}
  .menu.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--panel-2);border-bottom:1px solid var(--line);padding:10px;gap:0}
  .menu.open .mi > button{width:100%;text-align:left}
  .menu.open .dd{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;border:0;background:none;padding:0 0 8px 12px}
  .burger{display:block}
  header{position:relative}
}
@media (max-width:780px){
  .hero-in{grid-template-columns:1fr;gap:34px}
  .split{grid-template-columns:1fr}
  .split .media{order:0 !important;border-left:0;border-right:0;border-top:1px solid var(--line);min-height:240px}
  .split.rev .side{order:0}
  .dato{grid-template-columns:1fr;gap:12px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in">
    <span class="tag">Conqr · maqueta de sitio · v3</span>
    <span style="flex:1"></span>
    <span class="count">Visibles <b id="cv">—</b> · en el HTML <b id="ct">—</b></span>
    <button class="ctl" id="btn-all">Ver todo / Imprimir</button>
    <button class="ctl" id="btn-notes" aria-pressed="false">Notas SEO</button>
  </div>
</div>

<header>
  <div class="wrap nav">
    <span class="logo" data-go="home">conqr<i>.</i></span>
    <span class="nav-sp"></span>
    <nav class="menu" id="menu"></nav>
    <button class="burger" id="burger">Menú</button>
    <button class="pill" data-go="contacto">Contacto</button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap foot" id="foot"></div>
  <div class="wrap legal">© 2026 Conqr · Agencia de marketing digital en México · Maqueta de contenido, sin diseño final</div>
</footer>

  proseTitle:"Agencia de marketing digital en México",
  prose:`<p>Una agencia de marketing digital se contrata para resolver un problema concreto: la marca no está donde su comprador la busca. Ese comprador hoy busca en Google, pregunta en ChatGPT, compara en Instagram y decide frente al anaquel o en el pasillo de una expo. Atender solo una de esas superficies deja la venta a medias.</p>
<h3>Qué incluye el servicio</h3>
<p>El trabajo digital se organiza en cuatro frentes. <b>Posicionamiento orgánico</b>: investigación de las búsquedas con intención de compra, arquitectura del sitio, contenido y autoridad. <b>Publicidad pagada</b>: campañas en Google y Meta medidas por costo por prospecto. <b>Redes sociales</b>: calendario, producción y comunidad. <b>Medición</b>: analítica conectada al CRM, para saber qué canal trajo qué cliente.</p>

<h3>Por qué separar digital y físico cuesta dinero</h3>
<p>Cuando la campaña que llena el stand la hace una agencia y el stand lo monta otra, nadie responde por la conversión completa. El mensaje del anuncio no es el que dice la promotora, el registro del evento no se conecta con la fuente digital, y al cierre del trimestre el crédito se reparte a ojo. Trabajar las dos mitades con un solo equipo es la diferencia entre poder atribuir resultados y no poder.</p>
<h3>Cómo elegir agencia</h3>
<ul>
<li>Pide el reporte que entregan, no el caso de éxito. El reporte dice cómo trabajan todos los meses.</li>
<li>Pregunta quién ejecuta. Muchas agencias venden con seniors y operan con juniors.</li>
<li>Exige rangos de precio por escrito antes de la propuesta formal.</li>
<li>Confirma qué pasa con tus cuentas y tus datos si el contrato termina. Las cuentas publicitarias y el dominio tienen que quedar a tu nombre.</li>
</ul>
<h3>Cuánto cuesta</h3>
<p>En México, una iguala de marketing digital para una empresa mediana va de [X] a [Y] pesos mensuales, sin contar la inversión publicitaria. Un stand para expo se cotiza por metro cuadrado y una activación por punto de venta y por semana. El rango se mueve por tres cosas: número de canales, volumen de contenido y si hay producción física.</p>
<h3>Dónde opera Conqr</h3>
<p>Cobertura regional, pensamiento global. Con base en la Ciudad de México y clientes en Estados Unidos, Centroamérica, Caribe, Perú, Colombia y Brasil. Más de 125 marcas han pasado por aquí desarrollando conceptos, campañas, estrategias digitales y activaciones.</p>`,

  proseTitle:"Agencia BTL en México",
  prose:`<p>El marketing BTL existe porque hay una parte de la decisión de compra que ninguna campaña digital alcanza: el momento en que alguien está parado frente a dos productos y elige uno. Ahí no hay segmentación ni retargeting; hay un exhibidor, un precio y, si la marca invirtió bien, alguien que explica por qué vale la pena.</p>

<p>Una agencia BTL completa cubre cinco cosas: la estrategia de ejecución, el reclutamiento y alta del personal, la fabricación del material, la supervisión en ruta y el reporte. Las agencias que solo ponen gente son brokers de personal, no agencias. La diferencia se nota en la tercera semana, cuando hay que resolver una ausencia en una tienda de Monterrey un sábado.</p>

</ul>

  proseTitle:"Agencia de eventos corporativos en México",
  prose:`<p>Un evento corporativo es una operación logística con fecha inamovible. Esa es la diferencia con cualquier otro proyecto de marketing: si el audio no funciona a las nueve de la mañana, no hay versión dos. Por eso lo que se contrata en realidad no es creatividad, es previsión.</p>
<h3>Tipos de eventos corporativos</h3>
<ul>
<li><b>Convención de ventas.</b> Alineación de equipo, resultados y plan del año. Mucha producción audiovisual.</li>
<li><b>Lanzamiento de producto.</b> Prensa, clientes y un momento de revelación que tiene que quedar bien en foto.</li>
<li><b>Congreso o foro.</b> Registro, acreditación, salas simultáneas y ponentes. La logística manda.</li>
<li><b>Posada o fiesta de fin de año.</b> Entretenimiento y venue. Se contrata entre agosto y septiembre.</li>
<li><b>Team building.</b> Actividades de integración con objetivo medible, no dinámicas por llenar la agenda.</li>
</ul>
<h3>Qué incluye la producción</h3>
<p>Venue, montaje, mobiliario, audio, iluminación, pantallas, escenario, catering, protocolo, registro, staff, logística de traslados y desmontaje. Cada uno con responsable y con hora de entrega. Un presupuesto que no desglosa estas partidas esconde algo, casi siempre la renta del equipo.</p>
<h3>Cuánto cuesta</h3>
<p>El costo por asistente es la medida útil. Las variables que más lo mueven son la fecha —noviembre y diciembre cuestan más—, la ciudad, y si el evento necesita estructura, pantallas grandes o traslado de equipo. Para comparar dos cotizaciones, pide las dos en costo por asistente con el mismo alcance.</p>
<h3>Calendario: el error más caro</h3>
<p>Las empresas cierran proveedor de fin de año en septiembre, no en noviembre. Quien empieza a cotizar en octubre elige entre lo que sobró. Lo mismo pasa con convenciones de enero, que se arman en octubre. El calendario se trabaja hacia atrás desde la fecha, y el primer hito siempre es el venue.</p>
<h3>Cómo se mide un evento</h3>
<p>Asistencia contra registro, costo por asistente, satisfacción medida con encuesta en sitio y, cuando el evento es comercial, prospectos generados y oportunidades abiertas. Un evento sin registro conectado al CRM es un gasto que no se puede defender en la siguiente junta de presupuesto.</p>`,
  rel:["stands","btl","home","portafolio","blog"],
  ctaT:'¿Tienes fecha <em>y necesitas que salga bien?</em>',
  ctaS:"Cuéntanos formato, número de asistentes y fecha. Te mandamos un estimado."
};

  proseTitle:"Stands para expos y ferias",
  prose:`<p>Un stand tiene un trabajo medible: detener a alguien que va caminando por un pasillo lleno de competidores. Todo lo demás —el acabado, la iluminación, el mobiliario— existe para eso. Por eso el error más caro en una expo no es gastar de más en el stand, es gastar bien en un stand que nadie ve porque quedó a la altura equivocada.</p>
<h3>Qué define el costo</h3>
<ul>
<li><b>Metros cuadrados.</b> La base de toda cotización.</li>
<li><b>Material.</b> Melamina, madera, aluminio, estructura. Cambia precio, peso y tiempo de montaje.</li>
<li><b>Altura e iluminación.</b> Lo que hace que el stand se vea desde el otro extremo del pasillo.</li>
<li><b>Renta o compra.</b> La renta elimina el costo de bodega, mantenimiento y traslado entre expos.</li>
<li><b>Reutilización.</b> Un modular bien diseñado se amortiza en la tercera expo.</li>
</ul>
<h3>El proceso, con tiempos reales</h3>

<h3>Reglamentos que casi nadie lee</h3>
<p>Cada recinto tiene su propio reglamento: altura máxima, materiales permitidos, horarios de montaje y desmontaje, acceso de vehículos y credenciales del personal. Un diseño que ignora el reglamento se corrige en piso, a costa del expositor y con prisa. Leerlo antes del render ahorra más dinero que negociar el precio del material.</p>
<h3>Qué poner dentro del stand</h3>

<h3>Expos donde trabajamos</h3>
<p>Operamos en los principales recintos de la Ciudad de México, Guadalajara y Monterrey. [Listar recintos y expos recurrentes: es contenido local que posiciona y que la IA cita cuando alguien pregunta por proveedores de stands en una expo concreta.]</p>`,

  faq:[
    ["¿Qué es Meta Ads?","Es la plataforma publicitaria de Facebook, Instagram, Messenger y WhatsApp. Se administra desde una sola cuenta y permite segmentar por intereses, comportamiento y públicos propios, además de reconstruir audiencias parecidas a tus mejores clientes."],
    ["¿Cuánto cuesta anunciarse en Facebook?","La inversión mínima útil arranca en [X] pesos mensuales; por debajo de eso la campaña no sale de la fase de aprendizaje. El honorario de la agencia se cobra como [porcentaje o monto fijo]. El costo por prospecto depende sobre todo del sector y del creativo."],
    ["¿Facebook Ads o Google Ads?","Google captura demanda que ya existe: alguien está buscando lo que vendes. Meta genera demanda: le muestra tu producto a quien todavía no lo buscaba. Para servicios con búsqueda clara, Google primero. Para producto visual o categoría nueva, Meta."],
    ["¿Por qué no convierte mi campaña?","En orden de frecuencia: el creativo no detiene el scroll, el público es demasiado amplio o demasiado chico, la medición está mal instalada, o la oferta no es clara en los primeros tres segundos. Casi nunca es la segmentación sola."],

    ["Mi cuenta publicitaria está restringida, ¿pueden ayudarme?","Sí. Diagnosticamos la causa, preparamos la apelación y, si procede, reconstruimos la estructura para evitar que se repita. No hay garantía de reactivación: depende del motivo y del historial."],

  proseTitle:"Agencia de Facebook Ads y Meta Ads",
  prose:`<p>En Meta no compites por una búsqueda, compites por atención en un feed donde nadie llegó buscándote. Eso cambia todo: la segmentación importa menos de lo que se cree y el creativo importa más de lo que la mayoría de las agencias está dispuesta a admitir, porque producir creativo cuesta y configurar campañas no.</p>
<h3>Por qué el creativo manda</h3>
<p>Los algoritmos de Meta ya encuentran solos a la gente adecuada si tienen una señal clara de conversión. Lo que no pueden hacer es volver interesante un anuncio aburrido. Una cuenta sana prueba varias piezas nuevas al mes, en formatos nativos, y mata rápido lo que no detiene el scroll en los primeros tres segundos.</p>
<h3>Medición después de iOS</h3>
<ul>
<li><b>Píxel.</b> Sigue siendo la base, pero ya no ve todo.</li>
<li><b>API de Conversiones.</b> Manda los eventos desde tu servidor y recupera lo que el navegador bloquea.</li>
<li><b>Eventos bien definidos.</b> Compra, prospecto y contacto, cada uno con su valor.</li>
<li><b>Catálogo.</b> Indispensable para ecommerce y para campañas dinámicas.</li>
</ul>
<h3>Estructura de campaña</h3>
<p>Una estructura simple rinde más que una complicada: pocas campañas, presupuesto concentrado y suficientes conversiones para salir de aprendizaje. Partir el presupuesto en diez conjuntos de anuncios es la forma más común de impedir que el algoritmo aprenda.</p>
<h3>Cuentas restringidas</h3>
<p>Una cuenta inhabilitada detiene la venta de un día para otro, y la mayoría de las empresas no tiene plan para eso. Las causas frecuentes: políticas de salud o finanzas mal interpretadas, cambios bruscos de método de pago, o una página con historial de reportes. Tener una cuenta secundaria configurada y verificada antes de necesitarla ahorra semanas.</p>
<h3>Qué reportamos</h3>
<p>Inversión, prospectos o ventas, costo por resultado, qué creativo ganó y por qué, y qué se va a probar el mes siguiente. El reporte que importa compara contra el mes anterior y contra el costo del mismo prospecto en Google.</p>`,

  ctaT:'¿Revisamos tu cuenta <em>publicitaria?</em>',
  ctaS:"Auditoría de tu cuenta de Meta sin costo, con creativos y medición revisados."

  faq:[
    ["¿Qué es GEO?","GEO —generative engine optimization— es el trabajo de hacer que los motores con inteligencia artificial citen tu marca al responder preguntas de tu categoría. Comparte bases con el SEO, pero el objetivo cambia: no buscas una posición en una lista, buscas ser la fuente de una respuesta."],

  proseTitle:"Posicionamiento en inteligencia artificial",
  prose:`<p>Hay una pregunta que conviene hacerse antes de invertir un peso en esto: ¿cuánta gente está preguntándole a una IA por tu categoría? En México, hoy, para la mayoría de los sectores la respuesta es «poca, pero creciendo rápido». Eso no vuelve al GEO urgente; lo vuelve barato. El costo de estar presente en una categoría donde casi nadie publicó todavía es una fracción de lo que costará competir cuando todos lo hagan.</p>
<h3>Qué cambia respecto al SEO</h3>
<p>En un buscador peleas por un lugar en una lista de diez. En un modelo de lenguaje peleas por ser una de las dos o tres marcas que menciona una respuesta en prosa. No hay segunda página: o apareces o no existes. Y el usuario no compara diez opciones, acepta las que le dieron.</p>
<h3>Qué hace que una marca sea citable</h3>
<ul>
<li><b>Responder la pregunta en las primeras líneas,</b> sin introducción.</li>

<li><b>Estructura semántica limpia.</b> Un solo H1, jerarquía real, tablas como tablas.</li>
<li><b>Contenido en el HTML,</b> no inyectado con JavaScript al hacer clic. Los modelos no hacen clic.</li>
<li><b>Consistencia externa.</b> Mismo nombre, dirección y descripción en todos los directorios.</li>
</ul>
<h3>Cómo se mide</h3>

<h3>Lo que no vamos a prometer</h3>
<p>Nadie controla lo que responde un modelo. No hay una consola donde subir la posición, no hay acuerdos comerciales con OpenAI, y cualquiera que ofrezca «garantizar» una mención está vendiendo algo que no existe. Lo que sí se puede comprometer es el trabajo y la medición: qué se publica, qué se corrige y cómo se reporta cada mes.</p>`,

    ["Agencia BTL","Activaciones y punto de venta","btl"],
    ["Eventos corporativos","Convenciones y lanzamientos","eventos"],
    ["Stands para expos","Diseño, fabricación y montaje","stands"]
  ]},
  {label:"Paid media", items:[
    ["Google Ads","Búsqueda, Shopping y YouTube","google"],
    ["Meta Ads","Facebook e Instagram","meta"]
  ]},
  {label:"SEO y GEO", items:[
    ["Agencia SEO","Posicionamiento orgánico","seo"],
    ["Agencia GEO","Visibilidad en ChatGPT y buscadores con IA","geo"]
  ]},
  {label:"Portafolio", go:"portafolio"}
];

/* ===================== RENDER ===================== */
var cur = "home";
function ph(t,d,cls){ return '<div class="ph '+(cls||"")+'"><span class="t">'+t+'</span><span class="d">'+d+'</span></div>'; }

function buildPage(k){
  var p = P[k];
  var h = "";

  h += '<section class="hero"><div class="wrap hero-in"><div>'
     + '<div class="note"><div class="note-in">'+p.note+'</div></div>'
     + '<p class="kicker mono">'+p.kicker+'</p><p class="lede">'+p.lede+'</p><h1>'+p.h1+'</h1>'
     + '<div class="acts"><button class="btn" data-go="contacto">Agendar llamada</button>'
     + (k==="portafolio" ? '' : '<button class="btn btn-b" data-go="portafolio">Ver portafolio</button>')
     + '</div>'
     + '</div><div>'+ph(p.heroPh[0],p.heroPh[1],"ph-hero")+'</div></div></section>';

  if(p.etim){
    h += '<section><div class="wrap sec"><div class="etim">'
       + '<div><div class="w">con·<i>quer</i></div><div class="ph2">/ˈkäNGkər/ · verbo</div></div>'
       + '<div class="def">Superar un reto <b>con éxito.</b> Es lo que significa el nombre y es la única promesa que hacemos.</div>'
       + '</div></div></section>';
  }

  if(p.works){
    var cats = ["Todo"].concat(p.works.map(function(w){return w[0];}).filter(function(v,i,a){return a.indexOf(v)===i;}));
    h += '<section><div class="wrap sec"><div class="filters">'
       + cats.map(function(c,i){return '<button data-cat="'+c+'"'+(i===0?' class="on"':'')+'>'+c+'</button>';}).join("")
       + '</div><div class="works" id="works">'
       + p.works.map(function(w){
           return '<article class="work" data-cat="'+w[0]+'">'+ph("Imagen",w[1]+" — foto, render o captura del proyecto")
             +'<div class="in"><span class="cat">'+w[0]+'</span><h3>'+w[1]+'</h3><p>'+w[2]+'</p>'
             +'<p class="res">'+w[3]+'</p></div></article>';
         }).join("")+'</div></div></section>';
  }

  if(p.blocks){
    if(p.blocksNote) h += '<section><div class="wrap" style="padding-block:30px 0"><div class="note"><div class="note-in">'+p.blocksNote+'</div></div></div></section>';
    p.blocks.forEach(function(b,i){
      var id = b.anchor ? ' id="b-'+b.anchor+'"' : '';
      h += '<div class="split'+(i%2?' rev':'')+'"'+id+'>'
         + '<div class="side"><h2>'+b.t+'</h2><p class="txt">'+b.p+'</p>'
         + '<ul class="items">'+b.items.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul>'
         + (b.go ? '<button class="go" data-go="'+b.go+'">Ver '+P[b.go].nav+' →</button>' : '')
         + '</div><div class="media">'+ph(b.img[0],b.img[1])+'</div></div>';
    });
  }

  if(p.dato){
    h += '<section><div class="wrap sec"><div class="dato"><div class="big">'+p.dato.big+'</div>'
       + '<div><div class="t2">'+p.dato.t2+'</div><div class="src">'+p.dato.src+'</div></div></div></div></section>';
  }

  if(p.stats){
    h += '<section><div class="wrap sec"><div class="stats">'
       + p.stats.map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';}).join("")
       + '</div></div></section>';
  }

  if(p.plats){
    h += '<section><div class="wrap sec" style="text-align:center"><div class="sec-head" style="margin-inline:auto"><h2>'+p.platsTitle+'</h2></div><div class="plats">'
       + p.plats.map(function(x){return '<span>'+x+'</span>';}).join("")+'</div></div></section>';
  }

  if(p.posts){
    h += '<section><div class="wrap sec"><div class="sec-head"><h2>'+p.postsTitle+'</h2><p class="sub">'+p.postsSub+'</p></div><div class="posts">'
       + p.posts.map(function(a){
           return '<article class="post">'+ph("Portada",a[1])
             +'<div class="in"><p class="kv">'+a[0]+'</p><h3>'+a[1]+'</h3>'
             +'<p class="mt">'+a[2]+' → <span style="color:var(--accent);cursor:pointer" data-go="'+a[3]+'">'+P[a[3]].nav+'</span></p></div></article>';
         }).join("")+'</div></div></section>';
  }

  if(p.proc){
    h += '<section><div class="wrap sec"><div class="sec-head"><h2>'+p.procTitle+'</h2></div><div class="steps">'
       + p.proc.map(function(s,i){return '<div class="step"><span class="n">0'+(i+1)+'</span><h3>'+s[0]+'</h3><p>'+s[1]+'</p></div>';}).join("")
       + '</div></div></section>';
  }

  if(p.faq){
    h += '<section><div class="wrap sec"><div class="sec-head"><h2>Preguntas <em>frecuentes.</em></h2></div>'
       + '<div class="note"><div class="note-in"><b>Aquí va el grueso del texto.</b> Acordeón nativo &lt;details&gt;: el contenido viaja en el HTML aunque esté cerrado, así que cuenta para posicionamiento y es lo que más citan los modelos de IA. Marcar con schema FAQPage.</div></div>'
       + p.faq.map(function(f,i){return '<details'+(i===0?' open':'')+'><summary>'+f[0]+'</summary><div class="ans"><p>'+f[1]+'</p></div></details>';}).join("")
       + '</div></section>';
  }

  if(p.prose){
    h += '<section><div class="wrap sec"><div class="sec-head"><h2>'+p.proseTitle+'</h2></div>'
       + '<div class="note"><div class="note-in"><b>Bloque con «ver más».</b> Todo el texto está en el HTML desde la carga; el botón solo cambia max-height. Google lo indexa igual y ChatGPT lo lee sin abrirlo. Si se trajera con JavaScript al hacer clic, no existiría para ninguno de los dos.</div></div>'
       + '<div class="prose expand" id="exp">'+p.prose+'</div>'
       + '<button class="more" id="moreBtn" aria-expanded="false">Ver más ↓</button></div></section>';
  }

  if(p.rel){
    h += '<section><div class="wrap sec"><div class="sec-head"><h2>También <em>te sirve.</em></h2></div><div class="rel">'
       + p.rel.map(function(r){return '<button data-go="'+r+'">'+P[r].nav+' →</button>';}).join("")+'</div></div></section>';
  }

  h += '<section id="contacto"><div class="wrap cta"><h2>'+p.ctaT+'</h2><p>'+p.ctaS+'</p>'
     + '<button class="btn">Agendar llamada</button></div></section>';

  return h;
}

var ALL = ["home","redes","btl","eventos","stands","seo","google","meta","geo","portafolio","blog"];

function renderAll(){
  cur = "all";
  document.getElementById("app").innerHTML = ALL.map(function(k){
    return '<div class="pagewrap"><div class="plabel">'+P[k].nav+'</div>'+buildPage(k)+'</div>';
  }).join("");
  document.querySelectorAll(".expand").forEach(function(e){ e.classList.add("open"); });
  document.querySelectorAll("details").forEach(function(d){ d.open = true; });
  document.querySelectorAll(".more").forEach(function(b){ b.hidden = true; });
  wireAll();
  window.scrollTo(0,0);
}

function render(k, anchor){
  if(!P[k]) return;
  cur = k;
  var h = buildPage(k);
  document.getElementById("app").innerHTML = h;
  wireAll();
  document.querySelectorAll("#menu .mi").forEach(function(m){
    m.classList.toggle("on", m.dataset.page===k || (m.dataset.pages||"").split(",").indexOf(k)>-1);
  });
  document.getElementById("menu").classList.remove("open");
  if(anchor){
    var el = document.getElementById("b-"+anchor);
    if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  }
  window.scrollTo(0,0);
}

function go(t, anchor){
  if(t==="contacto"){ var c=document.getElementById("contacto"); if(c) c.scrollIntoView({behavior:"smooth"}); return; }
  if(!P[t]) return;
  if(t===cur && anchor){
    var el=document.getElementById("b-"+anchor);
    if(el){ el.scrollIntoView({behavior:"smooth"}); document.getElementById("menu").classList.remove("open"); return; }
  }
  render(t, anchor);
}

function wireAll(){
  document.querySelectorAll("[data-go]").forEach(function(el){
    if(el.dataset.wired) return; el.dataset.wired="1";
    el.addEventListener("click", function(){ go(el.dataset.go, el.dataset.anchor); });
  });
  var mb = document.getElementById("moreBtn");
  if(mb && !mb.dataset.wired){
    mb.dataset.wired="1";
    mb.addEventListener("click", function(){
      var box = document.getElementById("exp");
      var open = box.classList.toggle("open");
      mb.setAttribute("aria-expanded", open?"true":"false");
      mb.textContent = open ? "Ver menos ↑" : "Ver más ↓";
      count();
    });
  }
  document.querySelectorAll("details").forEach(function(d){
    if(d.dataset.wired) return; d.dataset.wired="1";
    d.addEventListener("toggle", count);
  });
  document.querySelectorAll(".filters button").forEach(function(b){
    if(b.dataset.wired) return; b.dataset.wired="1";
    b.addEventListener("click", function(){
      var c = b.dataset.cat;
      document.querySelectorAll(".filters button").forEach(function(o){ o.classList.toggle("on", o===b); });
      document.querySelectorAll("#works .work").forEach(function(w){
        w.hidden = !(c==="Todo" || w.dataset.cat===c);
      });
      count();
    });
  });
  count();
}

/* menu + footer */
(function(){
  var menu = document.getElementById("menu");
  MENU.forEach(function(m){
    var mi = document.createElement("div"); mi.className="mi";
    var b = document.createElement("button");
    if(m.go){ b.textContent = m.label; b.dataset.go = m.go; mi.dataset.page = m.go; }
    else { b.innerHTML = m.label + '<span class="car">▼</span>'; mi.dataset.pages = m.items.map(function(i){return i[2];}).join(","); }
    mi.appendChild(b);
    if(m.items){
      var dd = document.createElement("div"); dd.className="dd";
      m.items.forEach(function(it){
        var ib = document.createElement("button");
        ib.innerHTML = it[0] + '<span>' + it[1] + '</span>';
        ib.dataset.go = it[2];
        if(it[3]) ib.dataset.anchor = it[3];
        dd.appendChild(ib);
      });
      mi.appendChild(dd);
    }
    menu.appendChild(mi);
  });

  var foot = document.getElementById("foot");
  var groups = [["Creative",[["Creatividad","home","creatividad"],["Branding","home","branding"],["Web y e-commerce","home","web"]]],
                ["Contenido",[["Social media","redes"],["Portafolio","portafolio"],["Blog","blog"]]],
                ["Paid media",[["Google Ads","google"],["Meta Ads","meta"]]],
                ["Ejecución en piso",[["Agencia BTL","btl"],["Eventos corporativos","eventos"],["Stands para expos","stands"]]],
                ["Posicionamiento",[["Agencia SEO","seo"],["Agencia GEO","geo"]]]];
  groups.forEach(function(g){
    var d = document.createElement("div");
    d.innerHTML = "<h4>"+g[0]+"</h4>";
    g[1].forEach(function(it){
      var b = document.createElement("button"); b.textContent = it[0]; b.dataset.go = it[1];
      if(it[2]) b.dataset.anchor = it[2];
      d.appendChild(b);
    });
    foot.appendChild(d);
  });

  document.getElementById("btn-all").addEventListener("click", function(){ renderAll(); });
  document.getElementById("burger").addEventListener("click", function(){
    document.getElementById("menu").classList.toggle("open");
  });
  var bn = document.getElementById("btn-notes");
  bn.addEventListener("click", function(){
    var on = document.body.classList.toggle("notes");
    bn.setAttribute("aria-pressed", on?"true":"false");
    bn.textContent = on ? "Ocultar notas" : "Notas SEO";
    count();
  });
})();

/* contador */
function words(s){ var m=(s||"").trim().match(/[^\s]+/g); return m?m.length:0; }
function walk(node, visible){
  var total=0, vis=0;
  Array.prototype.forEach.call(node.childNodes, function(n){
    if(n.nodeType===3){ var w=words(n.nodeValue); total+=w; if(visible) vis+=w; return; }
    if(n.nodeType!==1) return;
    var v = visible;
    if(n.classList && n.classList.contains("note") && !document.body.classList.contains("notes")) v=false;
    if(n.classList && n.classList.contains("expand") && !n.classList.contains("open")) v=false;
    if(n.tagName==="DETAILS" && !n.open){
      var r1 = walk(n,false); total += r1.total;
      var sum = n.querySelector("summary");
      if(visible && sum) vis += words(sum.textContent);
      return;
    }
    var r = walk(n,v); total+=r.total; vis+=r.vis;
  });
  return {total:total, vis:vis};
}
function count(){
  var r = walk(document.getElementById("app"), true);
  document.getElementById("cv").textContent = r.vis;
  document.getElementById("ct").textContent = r.total;
}

wireAll();
render("home");
})();
